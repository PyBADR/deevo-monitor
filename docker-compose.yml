version: "3.9"

services:
  # ── Deevo Monitor Dashboard ─────────────────────────
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3001
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
      - CORTEX_URL=http://cortex:8010/api/v1/cortex
      - CORTEX_TOKEN=${CORTEX_TOKEN:-dev-token}
      - CORTEX_TENANT=${CORTEX_TENANT:-default}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - deevo-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Nginx Reverse Proxy (optional) ──────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      monitor:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deevo-net

networks:
  deevo-net:
    driver: bridge
